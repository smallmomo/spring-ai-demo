server:
  port: 8089

spring:
  application:
    name: spring-ai-auto-sql
  # Spring AI AI模型配置
  ai:
    # 模型类型选择: openai, glm
    provider: ${AI_PROVIDER:glm}
    
    # OpenAI 配置
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY:your-azure-openai-api-key}
        endpoint: ${AZURE_OPENAI_ENDPOINT:your-azure-openai-endpoint}

    
    # GLM 配置
    glm:
      api-key: ${GLM_API_KEY:your-glm-api-key}
      api-url: ${GLM_API_URL:https://open.bigmodel.cn/api/paas/v4/chat/completions}
      chat:
        options:
          model: glm-4.5
          temperature: 0.1


  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/spring_ai_auto_sql?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # MyBatis-Plus 配置
  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        id-type: assign_id
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0
    mapper-locations: classpath*:mapper/*.xml
    type-aliases-package: com.example.model

# 日志配置
logging:
  level:
    com.example: DEBUG